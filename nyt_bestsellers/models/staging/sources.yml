version: 2

sources:
  - name: nyt_raw
    description: >
      Raw NYT bestseller data loaded by ingest_nyt.py. Each pipeline run
      appends ~50 rows (5 categories x top 10 books) tagged with a
      pulled_at timestamp. Triggered weekly, externally, by a Windows Task
      Scheduler wake job (~11:45pm ET Wednesday) that runs
      scripts/run_weekly_pipeline.py, which starts Docker/Airflow and
      explicitly calls `airflow dags trigger` — not Airflow's own cron.
    project: nyt-bestsellers-492620
    dataset: nyt_raw
    tables:
      - name: raw_bestsellers
        description: >
          Append-only landing table for NYT bestseller snapshots. One row per
          (pulled_at, list_name, rank). Not deduped — re-running the pipeline
          on the same day produces duplicate rows. The intermediate model's
          recency_rank handles this softly by grouping ties.
        columns:
          - name: pulled_at
            description: UTC timestamp of when the ingest script ran.
          - name: list_name
            description: NYT category slug (kebab-case).
          - name: rank
            description: Position on the list (1–10).
          - name: title
            description: Book title in ALL CAPS as returned by the API.
          - name: author
            description: >
              Author string as returned by the API, e.g. "by R.J. Palacio"
              or "by Aaron Reynolds. Illustrated by Peter Brown".
          - name: publisher
            description: Publisher imprint.
          - name: description
            description: Book blurb.
          - name: amazon_url
            description: Amazon product page URL.
          - name: weeks_on_list
            description: Weeks the book has been on this list at snapshot time.
          - name: raw_json
            description: Full raw API response for the row, stored as JSON string.
