version: 2

models:
  - name: stg_nyt_bestsellers
    description: >
      Cleaned staging view over the raw NYT bestseller table. Applies
      presentation-layer transformations (title casing, author prefix
      stripping), a derived `pulled_date` column for downstream filtering,
      and deduplication to the model's true grain of one row per
      (pulled_date, list_name, rank). Preserves every snapshot; no recency
      filter at this layer.

      Not strictly one-to-one with the source: raw_bestsellers is
      append-only and can contain the same day's list more than once if the
      pipeline is run twice. This model keeps the most recent pull per grain.
    columns:
      - name: snapshot_row_key
        description: >
          Surrogate key (MD5 hex) over pulled_date + list_name + rank, which is this
          model's grain. The `unique` test below is the guard on the
          deduplication logic: if duplicate ingestion ever slips through,
          `dbt build` fails here rather than the numbers quietly doubling in
          the mart's counts and share-of-voice percentages.
        tests:
          - not_null
          - unique

      - name: pulled_at
        description: UTC timestamp of when the ingestion script ran.
        tests:
          - not_null

      - name: pulled_date
        description: >
          Derived from pulled_at (date only, drops time). Used as the snapshot
          identifier in downstream models.
        tests:
          - not_null

      - name: list_name
        description: NYT category slug (raw, kebab-case).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hardcover-fiction
                  - hardcover-nonfiction
                  - trade-fiction-paperback
                  - young-adult-hardcover
                  - childrens-middle-grade-hardcover

      - name: rank
        description: Position on the bestseller list (1 to 10).
        tests:
          - not_null

      - name: title
        description: >
          Book title in Title Case. NYT API returns titles in ALL CAPS; this
          column applies BigQuery's INITCAP() to capitalize the first letter
          of each word. Imperfect for English title case (capitalizes "the",
          "for", etc.) but a major readability improvement.
        tests:
          - not_null

      - name: author
        description: >
          Primary author(s) of the book, cleaned. NYT API returns this as
          "by R.J. Palacio" or "by Aaron Reynolds. Illustrated by Peter Brown".
          Two REGEXP_REPLACEs strip the leading "by " (case-insensitive) and
          the optional ". Illustrated by ..." trailing clause, leaving just
          the primary author name(s).
        tests:
          - not_null

      - name: publisher
        description: Publisher imprint, as returned by the NYT API.

      - name: description
        description: One-paragraph book blurb from the NYT API.

      - name: amazon_url
        description: Amazon product page URL for the book.

      - name: weeks_on_list
        description: >
          Number of consecutive weeks the book has been on this list, as
          reported by the NYT API at the time of the snapshot. Cast to INT64.

      - name: raw_json
        description: >
          Full raw API response for the book, stored as a JSON string.
          Kept for debugging and forward-compatibility if new fields are added.
